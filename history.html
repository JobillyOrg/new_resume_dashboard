<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jobilly.AI — Posting History</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #fff;
      --canvas: #f1f5f9;
      --brand: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body { font-family: system-ui, 'Segoe UI', sans-serif; background: var(--canvas); color: var(--ink); }
    a { color: inherit; text-decoration: none; }

    .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .rail {
      background: linear-gradient(180deg, #312e81 0%, #1e1b4b 100%);
      color: #fff; padding: 28px 22px; display: flex; flex-direction: column; gap: 24px;
      position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; flex-direction: column; gap: 14px; }
    .brand-logo {
      width: 64px; height: 64px; object-fit: contain; background: #fff;
      border-radius: 50%; padding: 10px; display: block;
    }
    .brand-mark { font-size: 22px; font-weight: 750; letter-spacing: -0.04em; line-height: 1.1; }
    .brand-mark span { color: #a5b4fc; }
    .brand-sub { margin-top: 6px; font-size: 12px; color: #c7d2fe; line-height: 1.5; }
    .rail-label {
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #a5b4fc; margin-bottom: 10px;
    }
    .rail-nav { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .rail-nav-link {
      display: block; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 650;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #e0e7ff;
      transition: background 0.15s ease;
    }
    .rail-nav-link:hover { background: rgba(255,255,255,0.14); }
    .rail-nav-link.active { background: #fff; color: #3730a3; border-color: #fff; }

    .workspace { padding: 28px 32px 48px; max-width: 1200px; }
    .masthead { margin-bottom: 24px; }
    .masthead h1 {
      font-size: 30px; font-weight: 750; letter-spacing: -0.04em;
      display: flex; align-items: center; gap: 12px;
    }
    .masthead-logo {
      width: 40px; height: 40px; object-fit: contain;
      background: #fff; border: 1.5px solid #c7d2fe; border-radius: 50%; padding: 6px;
    }
    .masthead p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.55; max-width: 720px; }

    .history-stats {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .stat-pill {
      background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; color: #475569;
    }
    .stat-pill strong { color: #4f46e5; }

    .history-empty {
      background: #fff; border: 1.5px dashed #c7d2fe; border-radius: 24px;
      padding: 48px 28px; text-align: center; color: var(--muted);
    }
    .history-empty h2 { font-size: 20px; color: var(--ink); margin-bottom: 8px; }
    .history-empty p { font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
    .btn-primary {
      display: inline-block; cursor: pointer; border: none; border-radius: 999px;
      font-size: 14px; font-weight: 650; padding: 12px 20px;
      background: #4f46e5; color: #fff;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary {
      display: inline-block; cursor: pointer; border: 1.5px solid #c7d2fe; border-radius: 999px;
      font-size: 13px; font-weight: 650; padding: 9px 16px;
      background: #fff; color: #3730a3;
    }
    .btn-secondary:hover { background: #eef2ff; }

    .history-list { display: flex; flex-direction: column; gap: 18px; }
    .history-card {
      background: #fff; border: 1.5px solid var(--line); border-radius: 22px;
      overflow: hidden; box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
    }
    .history-card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
      padding: 18px 20px 14px; border-bottom: 1.5px solid var(--line);
      background: linear-gradient(180deg, #fafbff 0%, #fff 100%);
      flex-wrap: wrap;
    }
    .history-card-title { font-size: 18px; font-weight: 800; color: #1e1b4b; line-height: 1.3; }
    .history-card-meta {
      margin-top: 6px; font-size: 12px; color: var(--muted); font-weight: 600;
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    }
    .history-card-meta .co { color: #4f46e5; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
    .history-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; flex-shrink: 0;
    }
    .history-badge.draft { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .history-badge.jd-only { background: #fef9c3; color: #a16207; border: 1px solid #fde047; }
    .history-card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .history-card-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 220px;
    }
    @media (max-width: 900px) { .history-card-body { grid-template-columns: 1fr; } }
    .history-pane {
      padding: 16px 18px 18px; min-width: 0; display: flex; flex-direction: column;
    }
    .history-pane + .history-pane { border-left: 1.5px solid var(--line); }
    @media (max-width: 900px) {
      .history-pane + .history-pane { border-left: none; border-top: 1.5px solid var(--line); }
    }
    .history-pane-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .history-pane-text {
      flex: 1; font-size: 12px; line-height: 1.65; color: #334155;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 12px 14px; max-height: 280px; overflow: auto; white-space: pre-wrap;
      word-break: break-word;
    }
    .history-pane-text.empty {
      color: #94a3b8; font-style: italic; display: flex; align-items: center; justify-content: center;
      min-height: 120px;
    }
    .history-pane-foot {
      margin-top: 8px; font-size: 11px; color: #94a3b8; font-weight: 600;
    }

    #toast {
      position: fixed; bottom: 24px; right: 24px; background: #4f46e5; color: #fff;
      padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity 0.3s; z-index: 9999;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .rail { position: static; height: auto; }
      .workspace { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="rail">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="Jobilly.AI">
      <div>
        <div class="brand-mark">Jobilly<span>.AI</span></div>
        <p class="brand-sub">Posting history</p>
      </div>
    </div>
    <div>
      <div class="rail-label">Navigation</div>
      <nav class="rail-nav" style="margin-top:0;">
        <a class="rail-nav-link" href="index.html">← Dashboard</a>
        <a class="rail-nav-link active" href="history.html">Full history</a>
      </nav>
    </div>
  </aside>

  <main class="workspace">
    <div class="masthead">
      <h1><img class="masthead-logo" src="logo.png" alt="">Posting history</h1>
      <p>Every job description and tailored resume saved in your workspace. Open a posting in the dashboard or print a tailored draft.</p>
    </div>

    <div class="history-stats" id="historyStats"></div>
    <div class="history-list" id="historyList"></div>
  </main>
</div>

<div id="toast"></div>
<script src="rag-engine.js?v=jdtitles"></script>
<script src="history.js?v=1"></script>
</body>
</html>
